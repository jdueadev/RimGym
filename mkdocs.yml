site_name: RimGym
site_description: RimGym - RL Agent Client & Gymnasium Environment for RimWorld
site_author: Jon Duea
site_url: https://jmduea.github.io/RimGym/

repo_name: jmduea/RimGym
repo_url: https://github.com/jmduea/RimGym
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Changelog: CHANGELOG.md
  - Getting Started:
      - Installation: guides/installation.md
      - Phase IV Usage: guides/phase4_usage.md
  - Architecture:
      - Overview: architecture/README.md
      - Real-Time Design: specs/REAL_TIME_ARCHITECTURE_UPDATE.md
      - Phase IV Design: specs/PHASE_IV_ARCHITECTURE.md
      - Phase V Design: specs/PHASE_V_ARCHITECTURE.md
      - Dashboard: specs/DASHBOARD_ARCHITECTURE.md
  - Implementation:
      - TCP Protocol: implementation/TCP_PROTOBUF_IMPLEMENTATION.md
      - Native DLL Fix: implementation/NATIVE_DLL_FIX.md
      - Docker Lessons: implementation/DOCKER_LESSONS_LEARNED.md
  - Docker:
      - Overview: docker/README.md
      - Quick Start: docker/QUICKSTART.md
      - Quick Reference: docker/QUICK_REFERENCE.md
      - Troubleshooting: docker/TROUBLESHOOTING.md
  - Guides:
      - Steam Workshop Upload: guides/steam-workshop-upload.md
  - Archive:
      - GRPC Migration: archive/GRPC_MIGRATION.md
      - Phase III Summary: archive/PHASE_III_COMPLETION_SUMMARY.md
      - Phase IV-3 Summary: archive/PHASE_IV_3_COMPLETION_SUMMARY.md
      - Phase IV-6 Summary: archive/PHASE_IV_6_COMPLETION_SUMMARY.md
      - Phase IV-7 Docker: archive/PHASE_IV_7_DOCKER_INTEGRATION.md
      - Phase V Option C: archive/PHASE_V_OPTION_C_COMPLETION.md
      - Production Hardening: archive/PHASE_V_PRODUCTION_HARDENING.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/RimGym/src"]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            filters: ["!^_"]

not_in_nav: |
  memory-bank/**
  api/**

exclude_docs: |
  memory-bank/**

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jmduea/RimGym
  version:
    provider: mike

copyright: Copyright &copy; 2025 Jon Duea
