name: Docker Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/rimgym-rimworld

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: test-runner

  docker-test:
    name: Run Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: docker-build
    if: false # Disabled until RimWorld volume setup is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore RimWorld cache
        id: cache-rimworld
        uses: actions/cache@v4
        with:
          path: rimworld-cache
          key: rimworld-linux-v1.6-${{ hashFiles('**/About.xml') }}
          restore-keys: |
            rimworld-linux-v1.6-

      - name: Setup RimWorld volume
        run: |
          docker volume create rimworld-data

          # If cache exists, populate volume
          if [ -d rimworld-cache ] && [ -f rimworld-cache/RimWorldLinux ]; then
            echo "Restoring RimWorld from cache..."
            docker run --rm \
              -v $(pwd)/rimworld-cache:/source:ro \
              -v rimworld-data:/dest \
              alpine cp -r /source/. /dest/
          else
            echo "⚠️ RimWorld cache not found"
            echo "To enable tests, set up RimWorld manually:"
            echo "1. Download RimWorld Linux version"
            echo "2. Create cache: docker run -v /path/to/rimworld:/source -v $(pwd)/rimworld-cache:/dest alpine cp -r /source/. /dest/"
            echo "3. Commit rimworld-cache to repository cache"
            exit 1
          fi

      - name: Pull Docker image
        run: docker pull ${{ needs.docker-build.outputs.image-tag }}

      - name: Run tests
        run: |
          docker run --rm \
            -v rimworld-data:/opt/rimworld \
            -v $(pwd)/test_results.txt:/app/test_results.txt \
            ${{ needs.docker-build.outputs.image-tag }} test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: test_results.txt

      - name: Check test results
        if: always()
        run: |
          if [ -f test_results.txt ]; then
            cat test_results.txt
            
            # Parse results
            if grep -q "❌ Failed: [1-9]" test_results.txt; then
              echo "::error::Integration tests failed"
              exit 1
            fi
            
            echo "✅ All Docker integration tests passed"
          else
            echo "::error::Test results file not found"
            exit 1
          fi

  docker-build-status:
    name: Docker Build Status
    runs-on: ubuntu-latest
    needs: docker-build
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "::error::Docker build failed"
            exit 1
          fi
          echo "✅ Docker image built successfully"
