name: PR Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Quick Validation
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic src/RimTCP/RimTCP/RimTCP.sln
        continue-on-error: true

      - name: Restore and build
        run: |
          dotnet restore src/RimTCP/RimTCP/RimTCP.sln
          dotnet build src/RimTCP/RimTCP/RimTCP.sln -c Release --no-restore

      - name: Run C# tests
        run: dotnet test tests/RimTCP.Tests/RimTCP.Tests.csproj --no-build -c Release

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Python tests
        run: |
          uv python install 3.11
          uv sync --project src/RimGym --group dev
          uv run python src/shared/python/src/generate_proto.py
          uv run --project src/RimGym pytest src/RimGym/tests/ -v

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';
            const message = `${icon} PR Validation ${status}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
