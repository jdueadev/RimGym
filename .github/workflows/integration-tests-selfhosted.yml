name: Integration Tests (Self-Hosted)

# This workflow is for contributors with self-hosted runners and RimWorld installed.
# It validates the complete Docker testing pipeline with actual game execution.
#
# Setup Requirements:
#   1. Self-hosted runner with Docker installed
#   2. RimWorld installed and RIMWORLD_PATH environment variable set
#   3. Runner labeled with 'rimworld-available'
#
# To enable: Add the 'rimworld-available' label to your self-hosted runner

on:
  workflow_dispatch:
    inputs:
      test_speeds:
        description: 'Test speeds to run (comma-separated: paused,1x,2x,3x or "all")'
        required: false
        default: "all"
  pull_request:
    branches: [main, develop]
    types: [labeled]

jobs:
  integration-test:
    name: Docker Integration Tests
    runs-on: self-hosted
    # Only run if:
    # 1. Manually triggered, OR
    # 2. PR has 'test-integration' label, OR
    # 3. Commit message contains '[test-integration]'
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'test-integration') ||
      contains(github.event.head_commit.message, '[test-integration]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify RimWorld installation
        shell: bash
        run: |
          if [ -z "$RIMWORLD_PATH" ]; then
            echo "::error::RIMWORLD_PATH environment variable not set on runner"
            echo "Please set RIMWORLD_PATH to your RimWorld installation directory"
            exit 1
          fi

          if [ ! -f "$RIMWORLD_PATH/RimWorldLinux" ] && [ ! -f "$RIMWORLD_PATH/RimWorldWin64.exe" ]; then
            echo "::error::RimWorld executable not found at $RIMWORLD_PATH"
            exit 1
          fi

          echo "✅ RimWorld found at: $RIMWORLD_PATH"

      - name: Setup Docker volume
        shell: bash
        run: |
          # Create volume if it doesn't exist
          if ! docker volume inspect rimworld-data &>/dev/null; then
            echo "Creating rimworld-data volume..."
            docker volume create rimworld-data
            
            # Populate from RIMWORLD_PATH
            docker run --rm \
              -v "$RIMWORLD_PATH:/source:ro" \
              -v rimworld-data:/dest \
              alpine cp -r /source/. /dest/
            
            echo "✅ RimWorld volume created and populated"
          else
            echo "✅ RimWorld volume already exists"
          fi

      - name: Verify/fix volume permissions
        shell: bash
        run: |
          if [ -f "docker/verify-and-fix-volume.ps1" ]; then
            pwsh docker/verify-and-fix-volume.ps1
          fi

      - name: Build Docker image
        run: docker-compose build test

      - name: Run integration tests
        env:
          TEST_SPEEDS: ${{ github.event.inputs.test_speeds || 'all' }}
        run: |
          docker-compose up test --abort-on-container-exit
        timeout-minutes: 15

      - name: Extract test results
        if: always()
        run: |
          # Copy results from container if it exists
          container_id=$(docker-compose ps -q test)
          if [ ! -z "$container_id" ]; then
            docker cp "$container_id:/app/test_results.txt" . || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_number }}
          path: test_results.txt
          retention-days: 30

      - name: Parse and display results
        if: always()
        shell: bash
        run: |
          if [ -f test_results.txt ]; then
            echo "=== Test Results ==="
            cat test_results.txt
            echo "===================="
            
            # Check for failures
            if grep -q "❌ Failed: [1-9]" test_results.txt; then
              echo "::error::Integration tests failed"
              exit 1
            fi
            
            # Extract summary
            passed=$(grep -oP "✅ Passed: \K\d+" test_results.txt || echo "0")
            echo "::notice::All $passed integration tests passed! 🎉"
          else
            echo "::error::Test results file not found"
            exit 1
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';

            let results = 'Test results not available';
            try {
              if (fs.existsSync('test_results.txt')) {
                results = fs.readFileSync('test_results.txt', 'utf8');
              }
            } catch (err) {
              console.log('Could not read test results:', err);
            }

            const body = `## ${icon} Integration Tests ${status}

            <details>
            <summary>Full Test Results</summary>

            \`\`\`
            ${results}
            \`\`\`

            </details>

            ---
            *Ran on self-hosted runner with RimWorld*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Cleanup
        if: always()
        run: docker-compose down -v
