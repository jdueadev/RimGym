name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger

env:
  DOTNET_VERSION: "8.0.x"
  PYTHON_VERSION: "3.11"

jobs:
  build-mod:
    name: Build C# Mod
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore RimworldMLBridge.sln

      - name: Build mod (Release)
        run: dotnet build RimworldMLBridge.sln -c Release --no-restore

      - name: Verify no native DLLs
        shell: pwsh
        run: |
          $nativeDlls = Get-ChildItem 1.6\Assemblies\*.dll | Where-Object { $_.Name -like "*csharp_ext*" -or $_.Name -like "*grpc_native*" }
          if ($nativeDlls) {
            Write-Error "❌ Native DLLs found in output: $($nativeDlls.Name -join ', ')"
            exit 1
          }
          Write-Host "✅ No native DLLs found"

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rimworld-ml-bridge-mod
          path: |
            1.6/Assemblies/*.dll
            About/About.xml
          retention-days: 30

      - name: List build outputs
        shell: pwsh
        run: |
          Write-Host "Build outputs:"
          Get-ChildItem 1.6\Assemblies\*.dll | ForEach-Object { 
            Write-Host "  $($_.Name) - $([math]::Round($_.Length/1KB, 2)) KB"
          }

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Generate protobuf bindings
        run: uv run python python/generate_proto.py

      - name: Run Python unit tests
        run: uv run pytest python/tests/ -v

      - name: Verify protobuf generation
        run: |
          if [ ! -f "python/mlbridge_pb2.py" ]; then
            echo "❌ Protobuf bindings not generated"
            exit 1
          fi
          echo "✅ Protobuf bindings generated successfully"

  integration-test:
    name: Integration Tests (Self-Hosted)
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-integration]')
    needs: [build-mod, test-python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build mod
        run: dotnet build RimworldMLBridge.sln -c Release

      - name: Install dependencies
        run: uv sync

      - name: Generate protobuf bindings
        run: uv run python python/generate_proto.py

      - name: Copy mod to RimWorld
        shell: pwsh
        run: |
          if (-not $env:RIMWORLD_PATH) {
            Write-Error "❌ RIMWORLD_PATH not set on runner"
            exit 1
          }

          $modPath = Join-Path $env:RIMWORLD_PATH "Mods\RimworldMLBridge"

          # Clean and create mod directory
          if (Test-Path $modPath) { Remove-Item $modPath -Recurse -Force }
          New-Item -ItemType Directory -Path $modPath -Force

          # Copy mod files
          Copy-Item -Path "1.6" -Destination $modPath -Recurse
          Copy-Item -Path "About" -Destination $modPath -Recurse

          Write-Host "✅ Mod copied to RimWorld"

      - name: Run automated integration tests
        shell: pwsh
        run: |
          $env:RIMWORLD_PATH = $env:RIMWORLD_PATH
          uv run python python/test_automated_suite.py --output test_results.txt
        timeout-minutes: 10

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test_results.txt
          retention-days: 30

      - name: Check test results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test_results.txt) {
            Get-Content test_results.txt
            
            # Check if all tests passed
            $content = Get-Content test_results.txt -Raw
            if ($content -match "✅ Passed: (\d+)" -and $content -match "❌ Failed: (\d+)") {
              $passed = [int]$matches[1]
              $failed = [int]$matches[2]
              
              if ($failed -gt 0) {
                Write-Error "❌ $failed test(s) failed"
                exit 1
              }
              
              Write-Host "✅ All $passed tests passed!"
            }
          }

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-mod, test-python]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-mod.result }}" != "success" ]; then
            echo "❌ C# build failed"
            exit 1
          fi

          if [ "${{ needs.test-python.result }}" != "success" ]; then
            echo "❌ Python tests failed"
            exit 1
          fi

          echo "✅ All builds and tests passed!"
