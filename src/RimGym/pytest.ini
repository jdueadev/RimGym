[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Useful options
addopts = 
    -v
    --tb=short
    --strict-markers
# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests requiring RimWorld connection
    performance: Performance benchmarking tests
    slow: Tests that take more than 1 second
