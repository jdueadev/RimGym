[project]
name = "rimworldmlbridge"
version = "0.2.0"
description = "RimWorld ML Bridge with gRPC and Protocol Buffers"
requires-python = ">=3.8"
dependencies = [
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "protobuf>=4.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
