[project]
name = "rimworldmlbridge"
version = "0.3.0"
description = "RimWorld ML Bridge - Autonomous RL Agent Client (TCP + Protobuf)"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=4.24.0",
    "gymnasium>=0.29.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Exclude non-Python directories from package discovery
packages = []
py-modules = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "grpcio-tools>=1.59.0",
]
