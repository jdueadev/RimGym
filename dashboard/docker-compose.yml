version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dashboard-network
      - rimworld_network

  dashboard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SQLITE_PATH=/data/dashboard.db
      - POLL_INTERVAL_MS=100
      - WEBSOCKET_UPDATE_HZ=2
      - MAX_CONCURRENT_RUNS=10
      - ENABLE_AUTO_DISCOVERY=true
      - DOCKER_NETWORK=rimworld_network
      - LOG_LEVEL=INFO
    volumes:
      - dashboard-data:/data
      - ../python:/python:ro  # Mount Python client for SpectatorClient
    networks:
      - dashboard-network
      - rimworld_network
    restart: unless-stopped

  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - dashboard-backend
    networks:
      - dashboard-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  dashboard-data:
    driver: local

networks:
  dashboard-network:
    driver: bridge
  rimworld_network:
    external: true
    name: rimworld_network
